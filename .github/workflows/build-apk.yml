name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          VERSION_OUTPUT=$(java -version 2>&1 || true)
          FIRST_LINE=$(printf '%s\n' "$VERSION_OUTPUT" | head -n 1)
          RAW_VERSION=$(printf '%s' "$FIRST_LINE" | sed -n 's/.*"\([0-9][0-9]*\(\.[0-9][0-9]*\)*\).*".*/\1/p')

          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect Java version from output: $FIRST_LINE"
            exit 1
          fi

          MAJOR_VERSION=$(printf '%s' "$RAW_VERSION" | cut -d. -f1)
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION=$(printf '%s' "$RAW_VERSION" | cut -d. -f2)
          fi

          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse Java major version from: $RAW_VERSION"
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but found Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYTOOL_BIN="keytool"
          if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already present."
          else
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "./debug.keystore" \
              -storepass "android" \
              -alias "androiddebugkey" \
              -keypass "android" \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::Failed to generate temporary debug keystore."
              exit 1
            fi
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore does not exist after generation."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK was not found at: $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK path is not a regular file: $EXPECTED_APK"
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK file is empty: $EXPECTED_APK"
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::Expected debug APK does not have the .apk extension: $EXPECTED_APK"
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK")
          echo "Verified debug APK: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_DIR="${RUNNER_TEMP}/release-asset"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME=$(printf '%s' "$REPO_NAME" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"

          mkdir -p "$RELEASE_DIR"
          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK asset is missing or empty: $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release.outputs.asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-build-${{ github.run_number }}"
          RELEASE_TITLE="${GITHUB_REPOSITORY##*/} Debug APK #${{ github.run_number }}"
          RELEASE_NOTES="Automated debug APK build from branch \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`)."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
          fi
